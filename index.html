<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>id·logic · Trésorerie</title>
<meta name="theme-color" content="#2a6496"><meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a6496'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3Eid%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:light-dark(#f5f6f8,#0f141b);--card:light-dark(#fff,#171e28);--ink:light-dark(#17202c,#e8ecf2);--mut:light-dark(#667085,#93a0b2);--line:light-dark(#e4e7ec,#263040);--acc:light-dark(#2a6496,#6fb0e0);--accbg:light-dark(#dbe9f6,#14283a);--warn:light-dark(#b45309,#fbbf24);--warnbg:light-dark(#fef3c7,#3a2c0b);--bad:light-dark(#b42318,#f97066);--badbg:light-dark(#fee4e2,#3b1613);--ok:light-dark(#067647,#47cd89);--okbg:light-dark(#dcfae6,#10301f);--onacc:light-dark(#fff,#06201d)}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{height:34px;width:auto;display:block;border-radius:6px;background:light-dark(transparent,#fff);padding:3px 8px}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--mut);padding:12px 14px;font:500 14px inherit;font-family:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:20px}
h2{font-size:20px;letter-spacing:-.02em;margin:0 0 14px}h3{font-size:14px;margin:0 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi .l{color:var(--mut);font-size:12.5px}.kpi .v{font-size:23px;font-weight:650;letter-spacing:-.02em;margin:2px 0}.kpi .s{font-size:12px;color:var(--mut)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--accbg);color:var(--acc)}
.badge.w{background:var(--warnbg);color:var(--warn)}.badge.b{background:var(--badbg);color:var(--bad)}.badge.o{background:var(--okbg);color:var(--ok)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12.5px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
button.b{font:500 13px inherit;font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
button.x{color:var(--bad)}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:10px}label input,label select{margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{width:100%;max-width:440px;max-height:90vh;overflow:auto}
.gauge{height:14px;border-radius:99px;background:var(--line);overflow:hidden}.gauge i{display:block;height:100%;background:linear-gradient(90deg,#2a6496,#8dc63f)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tag{color:var(--mut);font-size:12px}@media print{:root,:root[data-theme]{color-scheme:light!important}#nav,#cloud,#mod,#toasts,.noprint,button,header .tag{display:none!important}body{background:#fff}.card{break-inside:avoid;box-shadow:none}}input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--bad);outline-color:var(--bad)}svg text{fill:var(--mut);font:11px system-ui,sans-serif}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}summary{cursor:pointer;color:var(--mut);font-size:12.5px;margin-top:8px}
#gate{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center}.gbox{background:var(--card);color:var(--ink);padding:28px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);width:min(340px,90vw)}.gbox h2{margin:0 0 4px}.gbox p{margin:6px 0}.gbox input{margin-bottom:10px}#g_err{color:var(--bad);font-size:13px;min-height:16px}#g_msg{color:var(--ok);font-size:13px}.gbox a{color:var(--acc)}
#cloud{display:none;position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 24px);z-index:900;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--mut);box-shadow:0 2px 8px rgba(0,0,0,.12)}#cloud a{color:var(--acc)}#c_st{cursor:default}
#toasts{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:10000;max-width:min(420px,calc(100vw - 24px))}.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;gap:14px;align-items:center;font-size:13px}.toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
</style></head><body>

function toast(m,o={}){const c=document.getElementById('toasts'),t=document.createElement('div'),s=document.createElement('span');t.className='toast';s.textContent=m;t.appendChild(s);

c.appendChild(t);setTimeout(()=>t.remove(),o.ms||(o.undo?8000:5000))}

const CFG={ent:{arr:()=>S.entries,t:'une entrée',f:[['label','Libellé'],['client','Client'],['type','Type','sel',[['rec','Contrat régulier mensuel'],['uni','Facture unique']]],['ht','Montant HT (€)','num'],['tva','TVA','sel',tvaOpts,1],['date','Date de début / facturation','date'],['end','Date de fin du contrat (facultatif, contrats réguliers)','date'],['status','Statut','sel',[['En attente','En attente'],['Payée','Payée']]],['delay',"Délai d'encaissement (jours) · ignoré si Payée",'num'],['pay',"Date d'encaissement (facture unique payée, facultatif)",'date']],d:()=>({type:'rec',tva:20,status:'En attente',date:defD(),delay:30})},

const ferr=(f,m)=>{const e=$('#f_err');if(e)e.textContent=m;const x=$('#f_'+f);if(x){x.setAttribute('aria-invalid','true');x.focus()}};
function vld(k,o,raw,id){const num=v=>v!==''&&Number.isFinite(parseFloat(v));
if(k==='ent'||k==='dep'){if(!o.label)return['label','Le libellé est obligatoire.'];if(k==='dep'){const it0=id?S.expenses.find(x=>x.id===id):null;if(!o.cat)return['cat','Choisissez une catégorie.'];if(!S.cats.includes(o.cat)&&!(it0&&it0.cat===o.cat))return['cat','Catégorie inconnue : choisissez-en une dans la liste.']}if(!okDate(o.date))return['date','Indiquez une date valide.'];
if(!num(raw.ht))return['ht','Le montant HT est obligatoire.'];if(o.ht===0&&o.type!=='varrec')return['ht','Le montant HT ne peut pas être 0 €.'];
if(o.end&&!okDate(o.end))return['end','La date de fin est invalide.'];if(o.end&&mk(o.end)<mk(o.date))return['end','La date de fin précède la date de début.'];
if(k==='ent'){if(o.delay<0)return['delay','Le délai ne peut pas être négatif.'];if(raw.pay&&!okDate(raw.pay))return['pay',"La date d'encaissement est invalide."]}}
if(k==='int'){if(!/^\d{4}-\d{2}$/.test(o.month)||+o.month.slice(5)<1||+o.month.slice(5)>12)return['month','Format attendu : AAAA-MM (ex. 2026-03).'];
if(!num(raw.brut)||o.brut<0)return['brut','Saisissez des intérêts bruts positifs ou nuls.'];if(S.qonto.interests.some(x=>x.month===o.month&&x.id!==id))return['month','Un relevé existe déjà pour ce mois : modifiez-le.']}
if(k==='pro'){if(!o.name)return['name','Le nom du prospect est obligatoire.'];if(!num(raw.val)||o.val<0)return['val','Saisissez une valeur estimée positive ou nulle.'];if(!okDate(o.close))return['close','Indiquez une date de closing valide.']}
return null}
function submit(k,id){const c=CFG[k],o={},raw={};document.querySelectorAll('#mod [aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'));
c.f.forEach(([n,,t,,num])=>{let v=$('#f_'+n).value;raw[n]=v;o[n]=n==='delay'&&v===''?30:(t==='num'||num)?parseFloat(v)||0:(t==='sel'?v:v.trim())});
const er=vld(k,o,raw,id);if(er){ferr(er[0],er[1]);return}
const it=id?c.arr().find(x=>x.id===id):null;
// changement de montant d'un récurrent déjà commencé : avenant à partir d'un mois (le passé ne bouge pas) ou correction depuis le début
if(it&&isRec(it)&&it.type===o.type&&it.date===o.date&&(o.ht!==it.ht||o.tva!==it.tva)&&mk(it.date)<curYM()){
const mo=prompt("Le montant change ("+E2(it.ht)+" → "+E2(o.ht)+" HT).\nÀ partir de quel mois (AAAA-MM) ce nouveau montant s'applique-t-il ? Les mois précédents gardent l'ancien montant (avenant).\n\nLaissez vide pour corriger le montant depuis le début (erreur de saisie).",curYM());

if(S.closed[+m2.slice(0,4)]){notify('Cet exercice est clôturé : rouvrez-le pour y modifier un montant.');return}
it.rev=(it.rev||[]).filter(r=>mk(r.from)!==m2);it.rev.push({from:m2+'-01',ht:o.ht,tva:o.tva});o.ht=it.ht;o.tva=it.tva}}

modal(`<h3>Avenants · ${esc(i.label)}</h3><p class="tag">Montant de départ : ${E2(i.ht)} HT (${String(i.tva).replace('.',',')} % de TVA) depuis ${mk(i.date)}. Un avenant change le montant à partir d'un mois sans modifier les mois précédents.</p>

<button class="b p" onclick="avnAdd('${k}','${id}')">Ajouter l'avenant</button> <button class="b" onclick="closeM()">Fermer</button>`)}
function avnAdd(k,id){const i=CFG[k].arr().find(x=>x.id===id),m=$('#av_m').value.trim(),v=$('#av_h').value;

import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,onSnapshot,serverTimestamp,runTransaction,collection,addDoc,query,orderBy,limit,getDocs,deleteDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDV0Ok0cq4y3R8aqlV0VtkPWCFC2lSpcIU",authDomain:"idlogic-compta.firebaseapp.com",projectId:"idlogic-compta",storageBucket:"idlogic-compta.firebasestorage.app",messagingSenderId:"668953619568",appId:"1:668953619568:web:e36ccb82993151696f18b5"});
const auth=getAuth(app),db=getFirestore(app),ref=doc(db,"apps","idelogic-tresorerie"),hist=collection(db,"apps","idelogic-tresorerie","history");
const MAXH=30,GAP=10*60*1000; // historique : 30 versions max, une toutes les 10 min au plus (sauf import / restauration / baisse du nombre de lignes)
const g=id=>document.getElementById(id),gate=g("gate"),cloud=g("cloud");
// last : dernier état local synchronisé · lastCloud : dernier JSON connu en ligne · rev : numéro de révision en ligne connu de cet appareil
let user=null,last="",lastCloud="",rev=getRev(),timer=null,retry=null,unsub=null,pend=null,pendC=null,busy=false,force=false,lastArch=0,histOk=true,HV={};
const st=t=>{g("c_st").textContent=t};
const who=e=>e?String(e).split("@")[0]:"?";
const hhmm=t=>{try{return(t&&t.toDate?t.toDate():new Date()).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}};
const okMsg=(by,t)=>"✓ Synchronisé"+(by?" · "+(user&&by===user.email?"vous":who(by))+" à "+hhmm(t):"")+(histOk?"":" · ⚠ historique indisponible");
const cnt=s=>{try{const d=JSON.parse(s);return(d.entries||[]).length+(d.expenses||[]).length+(d.prospects||[]).length+((d.qonto||{}).interests||[]).length}catch(e){return 0}};
// saisie ou fenêtre en cours : on ne remplace pas l'écran sous les doigts de l'utilisateur
const blocked=()=>{if(g("mod").innerHTML.trim())return true;
return[...document.querySelectorAll("#app input,#app textarea")].some(e=>e.type!=="file"&&e.value!==e.defaultValue)||[...document.querySelectorAll("#app select")].some(s=>[...s.options].some(o=>o.selected!==o.defaultSelected))};
// historique : on conserve la version qui va être remplacée
async function archive(json,by,why){
  if(!json||!histOk)return;
  try{
    await addDoc(hist,{json,by:by||"",at:serverTimestamp(),why:why||""});
    lastArch=Date.now();
    const qs=await getDocs(query(hist,orderBy("at","desc")));
    for(const d of qs.docs.slice(MAXH))await deleteDoc(d.ref);
  }catch(e){console.error("historique",e);histOk=false}
}
function apply(c){
  let d;try{d=JSON.parse(c.json)}catch(e){st("⚠ Données en ligne illisibles");return}
  setS(d);last=ser();lastCloud=c.json;rev=c.rev||0;setRev(rev);setDirty(false);pend=null;render();st(okMsg(c.by,c.at))
}
function conflict(c){
  pendC=c;st("⚠ Conflit : cliquer pour résoudre");
  let theirs="";try{theirs=sumS(JSON.parse(c.json))}catch(e){}
  modal(`<h3>Conflit de synchronisation</h3><p>${esc(who(c.by))} a modifié les données en ligne (${esc(hhmm(c.at))}) alors que cet appareil a des modifications non envoyées.</p><p class="tag">En ligne : ${esc(theirs)}<br>Cet appareil : ${esc(sumS(S))}</p><p>Quelle version garder ? L'autre est conservée dans l'historique en ligne (Sauvegarde → Historique en ligne).</p><button class="b p" onclick="cloudTake()">Garder la version en ligne</button> <button class="b" onclick="cloudOver()">Garder ma version</button>`)
}
g("c_st").onclick=()=>{if(pendC)conflict(pendC)};
window.cloudTake=async()=>{const c=pendC;if(!c)return;pendC=null;pend=null;closeM();await archive(ser(),user&&user.email,"version de cet appareil écartée");apply(c)};
window.cloudOver=()=>{const c=pendC;if(!c)return;pendC=null;pend=null;rev=c.rev||0;setRev(rev);force=true;closeM();push()};
async function push(){
  if(!user||busy||pendC)return;
  const j=ser();
  if(j===last){setDirty(false);return}
  busy=true;clearTimeout(retry);
  try{
    st("Synchronisation…");
    const cs=await getDoc(ref),cd=cs.exists()?cs.data():null;
    if(cd&&(cd.rev||0)!==rev){conflict(cd);return}
    if(cd&&(force||Date.now()-lastArch>GAP||cnt(j)<cnt(cd.json)))await archive(cd.json,cd.by,force?"avant remplacement complet":"");
    await runTransaction(db,async tx=>{const s=await tx.get(ref),ex=s.exists();if(ex!==!!cd||(ex&&(s.data().rev||0)!==rev))throw new Error("conflict");tx.set(ref,{json:j,by:user.email,at:serverTimestamp(),rev:rev+1})});
    rev+=1;setRev(rev);last=j;lastCloud=j;force=false;
    if(ser()===j)setDirty(false);else window.cloudPush();
    st(okMsg(user.email,null));
  }catch(e){
    if(e&&e.message==="conflict"){try{const s=await getDoc(ref);if(s.exists())conflict(s.data());else retry=setTimeout(push,1000)}catch(e2){st("⚠ Non synchronisé · nouvel essai dans 30 s");retry=setTimeout(push,30000)}}
    else{console.error(e);st("⚠ Non synchronisé · nouvel essai dans 30 s");retry=setTimeout(push,30000)}
  }finally{busy=false}
}
window.cloudPush=()=>{if(!user)return;clearTimeout(timer);timer=setTimeout(push,600)};
window.cloudForce=()=>{force=true};
window.cloudOn=()=>!!user;
window.cloudResume=()=>{if(!pend||blocked())return;const d=pend;pend=null;if(isDirty())conflict(d);else apply(d)};
setInterval(()=>window.cloudResume(),2000);
const flush=()=>{if(user&&isDirty()&&!pendC){clearTimeout(timer);push()}};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});
window.addEventListener("pagehide",flush);window.addEventListener("online",flush);
window.cloudHistory=async()=>{
  if(!user){notify("Connectez-vous pour voir l'historique.");return}
  try{
    const qs=await getDocs(query(hist,orderBy("at","desc"),limit(MAXH)));HV={};
    const rows=qs.docs.map(d=>{const x=d.data();HV[d.id]=x;let s="";try{s=sumS(JSON.parse(x.json))}catch(e){}
      const dt=x.at&&x.at.toDate?x.at.toDate():null;
      return `<tr><td>${dt?esc(dt.toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})):"…"}</td><td>${esc(who(x.by))}</td><td class="tag" style="white-space:normal">${esc(s)}${x.why?" · "+esc(x.why):""}</td><td><button class="b" onclick="cloudRestore('${d.id}')">Restaurer</button></td></tr>`}).join("");
    modal(`<h3>Historique en ligne</h3><p class="tag">Les ${MAXH} dernières versions conservées avant chaque remplacement. Restaurer une version conserve d'abord l'état actuel.</p><div class="tw"><table>${rows||'<tr><td>Aucune version pour l\'instant.</td></tr>'}</table></div><button class="b" onclick="closeM()">Fermer</button>`)
  }catch(e){notify("Historique inaccessible : "+(e.code||e.message)+"\nVérifiez les règles Firestore (sous-collection history).")}
};
window.cloudRestore=async id=>{
  const x=HV[id];if(!x)return;let d;try{d=JSON.parse(x.json)}catch(e){}
  if(!okShape(d)){notify("Version illisible.");return}
  if(!confirm("Restaurer cette version ?\n\nVersion à restaurer : "+sumS(d)+"\nVersion actuelle : "+sumS(S)+"\n\nLa version actuelle sera conservée dans l'historique."))return;
  await archive(ser(),user&&user.email,"avant restauration");
  setS(d);save();closeM();render()
};
async function login(){
  g("g_err").textContent="";g("g_msg").textContent="";
  try{await signInWithEmailAndPassword(auth,g("g_mail").value.trim(),g("g_pw").value)}
  catch(e){g("g_err").textContent=(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"||e.code==="auth/user-not-found")?"E-mail ou mot de passe incorrect.":"Erreur : "+(e.code||e.message)}
}
g("g_go").onclick=login;
g("g_pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
g("g_forgot").onclick=async e=>{
  e.preventDefault();g("g_err").textContent="";g("g_msg").textContent="";
  const m=g("g_mail").value.trim();if(!m){g("g_err").textContent="Saisissez d'abord votre e-mail ci-dessus.";return}
  try{await sendPasswordResetEmail(auth,m)}catch(err){console.error(err);if(err.code==="auth/invalid-email"){g("g_err").textContent="Adresse e-mail invalide.";return}if(err.code==="auth/network-request-failed"){g("g_err").textContent="Réseau indisponible.";return}}
  g("g_msg").textContent="Si cette adresse est enregistrée, un e-mail de réinitialisation vient d'être envoyé."
};
g("c_out").onclick=async e=>{
  e.preventDefault();
  if(isDirty()){clearTimeout(timer);await push()}
  if(isDirty()){if(!confirm("Des modifications ne sont pas encore synchronisées. Se déconnecter quand même ? Elles restent sur cet appareil et seront proposées à la prochaine connexion."))return;await signOut(auth);return}
  const wipe=confirm("Effacer aussi les données enregistrées sur cet appareil ?\nOK = effacer (recommandé sur un poste partagé) · Annuler = les conserver.");
  await signOut(auth);
  if(wipe){clearLocal();location.reload()}
};
onAuthStateChanged(auth,async u=>{
  window.__fbAuth=1;user=u;if(u){try{localStorage.setItem(KEY+'_seen','1')}catch(e){}}
  if(!u){if(unsub){unsub();unsub=null}clearTimeout(timer);clearTimeout(retry);pend=null;pendC=null;last="";lastCloud="";gate.style.display="flex";cloud.style.display="none";return}
  try{
    const snap=await getDoc(ref);
    gate.style.display="none";cloud.style.display="block";
    if(snap.exists()){
      const c=snap.data();lastCloud=c.json;
      if(!isDirty())apply(c);
      else if((c.rev||0)===rev){st("Envoi de vos modifications…");last="";push()} // modifications locales jamais envoyées, rien n'a changé en ligne
      else conflict(c)
    }else st("Aucune donnée en ligne : importez votre JSON");
    unsub=onSnapshot(ref,s=>{
      if(!s.exists()||busy)return;
      const d=s.data(),r=d.rev||0;
      if(d.json===lastCloud||(r&&r<=rev))return;
      if(blocked()){pend=d;st("Mise à jour en ligne en attente de la fin de votre saisie");return}
      if(isDirty())conflict(d);else apply(d)
    },e=>{console.error(e);st("⚠ Connexion perdue")});
  }catch(e){
    console.error(e);gate.style.display="flex";
    g("g_err").textContent=(e.code==="unavailable"||/offline/i.test(e.message||""))?"Serveur injoignable : vérifiez votre connexion puis rechargez la page.":"Accès refusé ou base introuvable : "+(e.code||e.message);
  }
});

</script>
</body></html>
