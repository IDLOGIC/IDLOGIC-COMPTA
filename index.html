<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>id·logic · Trésorerie</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--ink:#17202c;--mut:#667085;--line:#e4e7ec;--acc:#2a6496;--accbg:#dbe9f6;--warn:#b45309;--warnbg:#fef3c7;--bad:#b42318;--badbg:#fee4e2;--ok:#067647;--okbg:#dcfae6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#171e28;--ink:#e8ecf2;--mut:#93a0b2;--line:#263040;--acc:#6fb0e0;--accbg:#14283a;--warn:#fbbf24;--warnbg:#3a2c0b;--bad:#f97066;--badbg:#3b1613;--ok:#47cd89;--okbg:#10301f}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#171e28;--ink:#e8ecf2;--mut:#93a0b2;--line:#263040;--acc:#6fb0e0;--accbg:#14283a;--warn:#fbbf24;--warnbg:#3a2c0b;--bad:#f97066;--badbg:#3b1613;--ok:#47cd89;--okbg:#10301f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{height:34px;width:auto;display:block;border-radius:6px}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#fff;padding:3px 8px}}:root[data-theme="dark"] .logo{background:#fff;padding:3px 8px}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--mut);padding:12px 14px;font:500 14px inherit;font-family:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:20px}
h2{font-size:20px;letter-spacing:-.02em;margin:0 0 14px}h3{font-size:14px;margin:0 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi .l{color:var(--mut);font-size:12.5px}.kpi .v{font-size:23px;font-weight:650;letter-spacing:-.02em;margin:2px 0}.kpi .s{font-size:12px;color:var(--mut)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--accbg);color:var(--acc)}
.badge.w{background:var(--warnbg);color:var(--warn)}.badge.b{background:var(--badbg);color:var(--bad)}.badge.o{background:var(--okbg);color:var(--ok)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12.5px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
button.b{font:500 13px inherit;font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}:root[data-theme="dark"] button.p{color:#06201d}
button.x{color:var(--bad)}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:10px}label input,label select{margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{width:100%;max-width:440px;max-height:90vh;overflow:auto}
.gauge{height:14px;border-radius:99px;background:var(--line);overflow:hidden}.gauge i{display:block;height:100%;background:linear-gradient(90deg,#2a6496,#8dc63f)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tag{color:var(--mut);font-size:12px}svg text{fill:var(--mut);font:11px Inter,system-ui,sans-serif}
</style></head><body>

let c='';for(let i=0;i<first;i++)c+='<span></span>';
for(let d=1;d<=n;d++){const T=d===t.getDate()&&m===t.getMonth()&&y===t.getFullYear();c+=`<button class="b" style="padding:6px 0;${T?'border-color:var(--acc);font-weight:700;':''}" title="${esc((ev[d]||[]).join(' · '))}" onclick="setFY(${y});closeM()">${d}${ev[d]?'<br><span style="color:var(--acc)">•</span>':''}</button>`}
modal(`<div class="bar"><button class="b" onclick="calM(${m?y:y-1},${m?m-1:11})">‹</button><h3 style="margin:0">${new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h3><button class="b" onclick="calM(${m<11?y:y+1},${m<11?m+1:0})">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">${'LMMJVSD'.split('').map(x=>`<span class="tag">${x}</span>`).join('')}${c}</div><p class="tag">• : facture, dépense ou closing ce jour-là (survol pour le détail). Un clic ouvre l'exercice ${y}.</p><button class="b" onclick="closeM()">Fermer</button>`)}
function vList(kind){const isE=kind==='ent',L=(isE?S.entries:S.expenses).filter(inFY),TL=isE?{rec:'Contrat régulier',uni:'Facture unique'}:{fixe:'Fixe récurrente',var:'Variable ponctuelle',varrec:'Variable récurrente'};
const tot=L.reduce((a,i)=>a+i.ht,0);
return `<div class="bar"><h2 style="margin:0">${isE?'Entrées & Factures':'Dépenses'}</h2><button class="b p" onclick="edit('${kind}')">+ Ajouter</button></div>
<div class="card tw"><table><tr><th>Libellé</th><th>${isE?'Client':'Catégorie'}</th><th>Type</th><th>Date</th><th class="n">HT</th><th class="n">TVA</th><th class="n">TTC</th><th>Statut</th><th></th></tr>
${L.map(i=>`<tr><td>${esc(i.label)}</td><td>${esc(isE?i.client:i.cat)}</td><td><span class="badge ${i.type==='rec'||i.type==='fixe'?'':'w'}">${TL[i.type]}</span></td><td>${i.date}</td><td class="n">${E2(i.ht)}</td><td class="n">${E2(tv(i))}</td><td class="n">${E2(ttc(i))}</td><td><span class="badge ${i.status==='Payée'?'o':'w'}">${i.status}</span></td><td>${i.type==='varrec'?`<button class="b" onclick="act('${i.id}')">Réels</button> `:''}<button class="b" onclick="edit('${kind}','${i.id}')">Modifier</button> <button class="b x" onclick="del('${kind}','${i.id}')">Suppr.</button></td></tr>`).join('')||'<tr><td colspan="9">Aucune ligne. Ajoutez-en une.</td></tr>'}</table></div>
${isE?'':varCard()}
<p class="tag">Les lignes récurrentes sont reconduites chaque mois dès leur date de début. Pour une variable récurrente, le montant saisi est le prévisionnel de départ : chaque mois utilise la facture réelle (bouton « Réels »), sinon une estimation. Total HT saisi : ${E(tot)}.</p>`}
function varStats(i,y){let n=0,nr=0,real=0,est=0;fyM(y).forEach(m=>{if(m<mk(i.date))return;n++;const x=vr(i,m);if(i.act&&i.act[m]){real+=x.ht;nr++}else est+=x.ht});return{n,nr,real,est,tot:real+est,bud:n*i.ht}}
function varCard(){const L=S.expenses.filter(i=>i.type==='varrec'&&inFY(i));if(!L.length)return'';const y=S.fy,T={real:0,est:0,tot:0,bud:0},bd=d=>`<span class="badge ${d>0?'b':'o'}">${d>0?'+':''}${E(d)}</span>`;
const rows=L.map(i=>{const v=varStats(i,y);['real','est','tot','bud'].forEach(k=>T[k]+=v[k]);
return `<tr><td>${esc(i.label)}</td><td class="n">${v.nr}/${v.n}</td><td class="n">${E(v.bud)}</td><td class="n">${E(v.real)}</td><td class="n">${E(v.est)}</td><td class="n"><b>${E(v.tot)}</b></td><td class="n">${bd(v.tot-v.bud)}</td><td><button class="b p" onclick="act('${i.id}')">Réels</button></td></tr>`}).join('');
return `<div class="card tw" style="margin-top:16px"><h3>Charges variables · exercice ${y} (HT)</h3><table><tr><th>Poste</th><th class="n">Mois saisis</th><th class="n">Budget initial</th><th class="n">Réel saisi</th><th class="n">Estimé (reste)</th><th class="n">Total exercice</th><th class="n">Écart / budget</th><th></th></tr>${rows}
<tr><td><b>Total</b></td><td></td><td class="n">${E(T.bud)}</td><td class="n">${E(T.real)}</td><td class="n">${E(T.est)}</td><td class="n"><b>${E(T.tot)}</b></td><td class="n">${bd(T.tot-T.bud)}</td><td></td></tr></table>
<p class="tag">Mois sans facture : ${S.avgMode==='all'?'moyenne de toutes les factures saisies':"moyenne des factures saisies de l'exercice (à défaut, de tout l'historique)"}, à défaut le montant prévisionnel de départ (réglable dans Paramètres). Budget initial = prévisionnel × nombre de mois actifs.</p></div>`}
function vQon(){const y=S.fy,q=qcalc(y),Q=q.p;
return `<div class="bar"><h2 style="margin:0">Compte Qonto</h2><button class="b p" onclick="edit('int')">+ Saisir des intérêts</button></div>
<div class="grid"><div class="card kpi"><div class="l">Abonnement annuel</div><div class="v">${E2(Q.annual)}</div><div class="s">Flat tax ${String(Q.flat).replace('.',',')} %</div></div>
<div class="card kpi"><div class="l">Intérêts bruts ${y}</div><div class="v">${E2(q.brut)}</div><div class="s">Net cumulé : ${E2(q.net)}</div></div>
<div class="card kpi"><div class="l">Coût résiduel</div><div class="v">${E2(q.resid)}</div><div class="s">${q.resid>0?'<span class="badge w">En cours d\'amortissement</span>':'<span class="badge o">Abonnement amorti</span>'}</div></div>
<div class="card kpi"><div class="l">Produit financier net</div><div class="v">${E2(q.surplus)}</div><div class="s">Ajouté au résultat, hors CA${q.est>0?' · + '+E2(q.est)+' estimés sur '+q.nEst+' mois non saisis (moyenne)':''}</div></div></div>
<div class="card" style="margin-bottom:16px"><h3>Jauge d'amortissement : ${q.pct.toFixed(0)} %</h3><div class="gauge" role="progressbar" aria-valuenow="${q.pct.toFixed(0)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${q.pct}%"></i></div></div>
<div class="card tw"><table><tr><th>Mois</th><th class="n">Brut</th><th class="n">Flat tax</th><th class="n">Net</th><th class="n">Net cumulé</th><th></th></tr>
${(()=>{let c=0;return [...q.L].sort((a,b)=>a.month<b.month?-1:1).map(i=>{const n=i.brut*(1-Q.flat/100);c+=n;return `<tr><td>${i.month}</td><td class="n">${E2(i.brut)}</td><td class="n">${E2(i.brut-n)}</td><td class="n">${E2(n)}</td><td class="n">${E2(c)}</td><td><button class="b x" onclick="del('int','${i.id}')">Suppr.</button></td></tr>`}).join('')})()}</table></div>`}
function vPro(){const P=S.prospects.filter(p=>p.close.startsWith(S.fy));const open=P.filter(p=>p.stage!=='Gagné'&&p.stage!=='Perdu').reduce((a,p)=>a+p.val,0);
return `<div class="bar"><h2 style="margin:0">Prospection</h2><button class="b p" onclick="edit('pro')">+ Prospect</button></div>
<div class="grid"><div class="card kpi"><div class="l">Pipe ouvert HT</div><div class="v">${E(open)}</div></div><div class="card kpi"><div class="l">Gagné HT</div><div class="v">${E(P.filter(p=>p.stage==='Gagné').reduce((a,p)=>a+p.val,0))}</div></div></div>
<div class="card tw"><table><tr><th>Prospect</th><th>Contact</th><th class="n">Valeur HT</th><th>Closing cible</th><th>Étape</th><th></th></tr>
${P.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.contact)}</td><td class="n">${E(p.val)}</td><td>${p.close}</td><td><select aria-label="Étape" onchange="stage('${p.id}',this.value)" style="width:auto">${STAGES.map(s=>`<option${s===p.stage?' selected':''}>${s}</option>`).join('')}</select></td><td><button class="b" onclick="edit('pro','${p.id}')">Modifier</button> <button class="b x" onclick="del('pro','${p.id}')">Suppr.</button></td></tr>`).join('')}</table></div>`}
function vSet(){const Q=QP(S.fy);
return `<h2>Paramètres</h2><div class="two"><div class="card"><h3>Qonto (exercice ${S.fy}) et trésorerie</h3>
<label>Taux de flat tax (%)<input id="s_f" type="number" step="0.1" value="${Q.flat}"></label>
<label>Abonnement annuel Qonto (€)<input id="s_a" type="number" step="0.01" value="${Q.annual}"></label>
<label>Solde bancaire au 1er janvier ${S.fy} (€)<input id="s_c" type="number" step="0.01" value="${S.open[S.fy]??''}" placeholder="Report de ${S.fy-1}"></label><label>TVA payée<select id="s_t"><option value="0"${S.tvaLag?'':' selected'}>Le mois même</option><option value="1"${S.tvaLag?' selected':''}>Le mois suivant (CA3)</option></select></label>
<label>TVA de décembre ${S.fy-1} payée en janvier ${S.fy} (€)<input id="s_to" type="number" step="0.01" value="${(S.tvaOpen||{})[S.fy]??''}" placeholder="Calculée à partir des données de ${S.fy-1}"></label><p class="tag">À renseigner pour le premier exercice (aucune donnée en ${S.fy-1}). Sans effet si la TVA est payée le mois même.</p>
<button class="b p" onclick="saveSet()">Enregistrer</button> <p class="tag">Taux et abonnement s'appliquent à l'exercice affiché ; les autres exercices ne changent pas.</p></div>
<div class="card"><h3>Fiscalité · exercice ${S.fy}</h3>${[['x_r1','IS taux réduit (%)',S.fisc.r1],['x_se','Seuil du taux réduit (€)',S.fisc.seuil],['x_r2','IS taux normal (%)',S.fisc.r2],['x_fl','Flat tax sur dividendes (%)',S.fisc.flat],['x_im',"Mois de paiement de l'IS (1-12, année suivante)",S.fisc.isMo],['x_dm','Mois de versement des dividendes (1-12, année suivante)',S.fisc.dvMo],['x_cp','Capital social (€)',S.fisc.cap],['x_rl','Réserve légale déjà constituée (€)',S.fisc.rl]].map(f=>`<label>${f[1]}<input id="${f[0]}" type="number" step="0.01" value="${f[2]}"></label>`).join('')}<label>Moyenne des réels (variables récurrentes)<select id="x_av"><option value="fy"${S.avgMode==='fy'?' selected':''}>Sur l'exercice (sinon tout l'historique)</option><option value="all"${S.avgMode==='all'?' selected':''}>Sur tout l'historique</option></select></label><button class="b p" onclick="saveFisc()">Enregistrer</button> <p class="tag">Le dividende et le report à nouveau se décident sur le tableau de bord.</p></div>
<div class="card"><h3>Données</h3><p><button class="b" onclick="exp()">Exporter en JSON</button></p><p><label>Importer un JSON<input type="file" accept=".json" onchange="imp(this)"></label></p>
<p><button class="b x" onclick="if(confirm('Remettre les données de démonstration ?')){S=seed();mig();save();render()}">Réinitialiser les données de test</button></p></div></div>`}
function render(){hdr();$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
$('#app').innerHTML=(STO?'':'<div class="card" style="border-color:var(--bad);margin-bottom:12px"><b>Sauvegarde automatique indisponible.</b> Ce navigateur bloque le stockage : vos saisies seront perdues à la fermeture. Ouvrez « Sauvegarde » en haut pour copier vos données.</div>')+{dash:vDash,ent:()=>vList('ent'),dep:()=>vList('dep'),qon:vQon,pro:vPro,set:vSet}[tab]()}
// ---- formulaires
const CFG={ent:{arr:()=>S.entries,t:'une entrée',f:[['label','Libellé'],['client','Client'],['type','Type','sel',[['rec','Contrat régulier mensuel'],['uni','Facture unique']]],['ht','Montant HT (€)','num'],['tva','TVA','sel',tvaOpts,1],['date','Date de début / facturation','date'],['status','Statut','sel',[['En attente','En attente'],['Payée','Payée']]],['delay',"Délai d'encaissement (jours) · ignoré si Payée",'num'],['pay',"Date d'encaissement (facture unique payée, facultatif)",'date']],d:()=>({type:'rec',tva:20,status:'En attente',date:defD(),delay:30})},
dep:{arr:()=>S.expenses,t:'une dépense',f:[['label','Libellé'],['cat','Catégorie'],['type','Type','sel',[['fixe','Fixe récurrente'],['var','Variable ponctuelle'],['varrec','Variable récurrente (réels mensuels)']]],['ht','Montant HT (€)','num'],['tva','TVA','sel',tvaOpts,1],['date','Date','date'],['status','Statut de paiement','sel',[['En attente','En attente'],['Payée','Payée']]]],d:()=>({type:'var',tva:20,status:'En attente',date:defD()})},
int:{arr:()=>S.qonto.interests,t:'des intérêts',f:[['month','Mois (AAAA-MM)'],['brut','Intérêts bruts (€)','num']],d:()=>({month:defD().slice(0,7)})},
pro:{arr:()=>S.prospects,t:'un prospect',f:[['name','Prospect'],['contact','Contact'],['val','Valeur estimée HT (€)','num'],['close','Closing cible','date'],['stage','Étape','sel',STAGES.map(s=>[s,s])]],d:()=>({stage:'Nouveau',close:defD().slice(0,8)+'28'})}};
function modal(h){$('#mod').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="card" role="dialog" aria-modal="true">${h}</div></div>`}
const closeM=()=>$('#mod').innerHTML='';
function edit(k,id){if(ro())return;const c=CFG[k],it=id?c.arr().find(x=>x.id===id):c.d();
modal(`<h3>${id?'Modifier':'Ajouter'} ${c.t}</h3>`+c.f.map(([n,l,t,o,num])=>`<label>${l}`+(t==='sel'?`<select id="f_${n}">${o.map(([v,x])=>`<option value="${v}"${String(it[n])===String(v)?' selected':''}>${x}</option>`).join('')}</select>`:`<input id="f_${n}" type="${t==='num'?'number':t==='date'?'date':'text'}" ${t==='num'?'step="0.01"':''} value="${esc(it[n]??'')}">`)+'</label>').join('')+
`<button class="b p" onclick="submit('${k}','${id||''}')">Enregistrer</button> <button class="b" onclick="closeM()">Annuler</button>`)}
function submit(k,id){const c=CFG[k],o={};c.f.forEach(([n,,t,,num])=>{let v=$('#f_'+n).value;o[n]=(t==='num'||num)?parseFloat(v)||0:v});
if(k==='int'&&!/^\d{4}-\d{2}$/.test(o.month)){alert('Format attendu : AAAA-MM');return}
if(id)Object.assign(c.arr().find(x=>x.id===id),o);else c.arr().push({id:uid(),...o});save();closeM();render()}
function del(k,id){if(ro())return;if(!confirm('Supprimer cette ligne ?'))return;const a=CFG[k].arr();a.splice(a.findIndex(x=>x.id===id),1);save();render()}
function stage(id,s){if(ro()){render();return}const p=S.prospects.find(x=>x.id===id);p.stage=s;save();
if(s==='Gagné')modal(`<h3>Prospect gagné : ${esc(p.name)}</h3><p>Injecter ${E(p.val)} HT dans les entrées ?</p>
<label>Type d'entrée<select id="c_t"><option value="rec">Contrat régulier mensuel</option><option value="uni">Facture unique</option></select></label>
<label>Date de début / facturation<input id="c_d" type="date" value="${p.close}"></label>
<button class="b p" onclick="conv('${id}')">Créer l'entrée</button> <button class="b" onclick="closeM();render()">Plus tard</button>`);else render()}
function conv(id){const p=S.prospects.find(x=>x.id===id);S.entries.push({id:uid(),type:$('#c_t').value,label:'Mission '+p.name,client:p.name,ht:p.val,tva:20,date:$('#c_d').value||p.close,status:'En attente'});save();closeM();tab='ent';render()}
function saveSet(){if(ro())return;S.qonto.byYear[S.fy]={flat:parseFloat($('#s_f').value)||0,annual:parseFloat($('#s_a').value)||0};{const v=$('#s_c').value;if(v===''){delete S.open[S.fy];delete S.openOk[S.fy]}else{S.open[S.fy]=parseFloat(v)||0;S.openOk[S.fy]=true}}S.tvaLag=+$('#s_t').value;{const v=$('#s_to').value;if(v==='')delete S.tvaOpen[S.fy];else S.tvaOpen[S.fy]=parseFloat(v)||0}save();alert('Paramètres enregistrés');render()}
function saveFisc(){if(ro())return;const g=id=>parseFloat($('#'+id).value)||0,mo=id=>Math.min(12,Math.max(1,Math.round(g(id))||1));S.fisc={r1:g('x_r1'),seuil:g('x_se'),r2:g('x_r2'),flat:g('x_fl'),isMo:mo('x_im'),dvMo:mo('x_dm'),cap:g('x_cp'),rl:g('x_rl')};S.avgMode=$('#x_av').value;save();alert('Fiscalité enregistrée');render()}
function act(id){if(ro())return;const i=S.expenses.find(x=>x.id===id),a=i.act||{},M=fyM(S.fy).filter(m=>m>=mk(i.date));
modal(`<h3>Réels mensuels · ${esc(i.label)} · ${S.fy}</h3><p class="tag">Laissez vide un mois non encore facturé : il sera estimé par la moyenne des réels.</p>${M.map(m=>`<div style="display:grid;grid-template-columns:60px 1fr 80px;gap:6px;margin-bottom:6px;align-items:center"><span>${m.slice(5)}/${m.slice(2,4)}</span><input id="a_${m}" type="number" step="0.01" placeholder="HT" value="${a[m]?a[m].ht:''}"><select id="t_${m}">${TVAS.map(t=>`<option${(a[m]?a[m].tva:i.tva)===t?' selected':''}>${t}</option>`).join('')}</select></div>`).join('')}<button class="b p" onclick="saveAct('${id}')">Enregistrer</button> <button class="b" onclick="closeM()">Annuler</button>`)}
function saveAct(id){const i=S.expenses.find(x=>x.id===id);i.act=i.act||{};fyM(S.fy).filter(m=>m>=mk(i.date)).forEach(m=>{const v=$('#a_'+m).value;if(v==='')delete i.act[m];else i.act[m]={ht:parseFloat(v)||0,tva:parseFloat($('#t_'+m).value)}});save();closeM();render()}
function exp(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S,null,2));a.download='idelogic-donnees.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.entries||!d.expenses||!d.qonto)throw 0;S=d;mig();save();render()}catch(e){alert('Fichier invalide : il doit contenir entries, expenses et qonto.')}};r.readAsText(f)}
render();
</script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDV0Ok0cq4y3R8aqlV0VtkPWCFC2lSpcIU",authDomain:"idlogic-compta.firebaseapp.com",projectId:"idlogic-compta",storageBucket:"idlogic-compta.firebasestorage.app",messagingSenderId:"668953619568",appId:"1:668953619568:web:e36ccb82993151696f18b5"});
const auth=getAuth(app),db=getFirestore(app),ref=doc(db,"apps","idelogic-tresorerie");
const g=id=>document.getElementById(id),gate=g("gate"),cloud=g("cloud");
let user=null,last="",timer=null,unsub=null;
const st=t=>{g("c_st").textContent=t};
function apply(j){S=JSON.parse(j);mig();last=j;render()}
window.cloudPush=()=>{
  if(!user)return;clearTimeout(timer);
  timer=setTimeout(async()=>{
    const j=JSON.stringify(S);if(j===last)return;
    try{st("Synchronisation…");await setDoc(ref,{json:j,by:user.email,at:serverTimestamp()});last=j;st("✓ Synchronisé")}
    catch(e){console.error(e);st("⚠ Non synchronisé")}
  },600);
};
async function login(){
  g("g_err").textContent="";
  try{await signInWithEmailAndPassword(auth,g("g_mail").value.trim(),g("g_pw").value)}
  catch(e){g("g_err").textContent=(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"||e.code==="auth/user-not-found")?"E-mail ou mot de passe incorrect.":"Erreur : "+(e.code||e.message)}
}
g("g_go").onclick=login;
g("g_pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
g("c_out").onclick=e=>{e.preventDefault();signOut(auth)};
onAuthStateChanged(auth,async u=>{
  user=u;
  if(!u){if(unsub){unsub();unsub=null}gate.style.display="flex";cloud.style.display="none";return}
  try{
    const snap=await getDoc(ref);
    if(snap.exists())apply(snap.data().json);
    gate.style.display="none";cloud.style.display="block";
    st(snap.exists()?"✓ Synchronisé":"Aucune donnée en ligne : importez votre JSON");
    unsub=onSnapshot(ref,s=>{
      if(!s.exists()||s.metadata.hasPendingWrites)return;
      const j=s.data().json;if(j===last)return;
      if(document.getElementById("mod").innerHTML.trim())return;
      apply(j);st("✓ Mis à jour");
    });
  }catch(e){
    console.error(e);gate.style.display="flex";
    g("g_err").textContent="Accès refusé ou base introuvable : "+(e.code||e.message);
  }
});
</script>
